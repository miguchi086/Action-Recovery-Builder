name: Build PBRP

on:
  workflow_dispatch:
    inputs:
      MANIFEST_URL:
        description: Manifest URL
        required: true
        default: 'https://github.com/PitchBlackRecoveryProject/manifest_pb.git'
      MANIFEST_BRANCH:
        description: Manifest Branch
        required: true
        default: 'android-12.1'
      DEVICE_TREE_URL:
        description: Device Tree URL
        required: true
        default: 'https://github.com/saadelasfur/pbrp_device_samsung_m52xq.git'
      DEVICE_TREE_BRANCH:
        description: Device Tree Branch
        required: true
        default: 'android-12.1'
      DEVICE_PATH:
        description: Device Path
        required: true
        default: 'device/samsung/m52xq'
      DEVICE_NAME:
        description: Device Name
        required: true
        default: 'm52xq'
      MAKEFILE_NAME:
        description: Makefile Name
        required: true
        default: 'pb_m52xq'
      BUILD_RELEASE:
        description: Build Release (trunk_staging, ap3a, bp1a...)
        required: true
        default: 'trunk_staging'
      BUILD_TARGET:
        description: Build Target (recovery, boot, vendor_boot)
        required: true
        default: 'recovery'
      PBRP_VERSION:
        description: PBRP Version
        required: false
        default: '4.0'

jobs:
  build:
    if: github.event.repository.owner.id == github.event.sender.id
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
    - name: Display Run Parameters
      run: |
        echo "::group::User Environment Variables"
        echo "Manifest URL: ${{ github.event.inputs.MANIFEST_URL }}"
        echo "Manifest Branch: ${{ github.event.inputs.MANIFEST_BRANCH }}"
        echo "Device Tree URL: ${{ github.event.inputs.DEVICE_TREE_URL }}"
        echo "Device Tree Branch: ${{ github.event.inputs.DEVICE_TREE_BRANCH }}"
        echo "Device Path: ${{ github.event.inputs.DEVICE_PATH }}"
        echo "Device Name: ${{ github.event.inputs.DEVICE_NAME }}"
        echo "Makefile Name: ${{ github.event.inputs.MAKEFILE_NAME }}"
        echo "Build Release: ${{ github.event.inputs.BUILD_RELEASE }}"
        echo "Build Target: ${{ github.event.inputs.BUILD_TARGET }}.img"
        echo "PBRP Version: ${{ github.event.inputs.PBRP_VERSION }}"
        echo "::endgroup::"

    - name: Check Out
      uses: actions/checkout@v4

    - name: Cleanup
      uses: rokibhasansagar/slimhub_actions@main

    - name: Prepare the environment
      run: |
        sudo apt update && sudo apt upgrade -y
        DEBIAN_FRONTEND=noninteractive sudo apt install -yq \
            linux-modules-extra-$(uname -r) \
            gperf gcc-multilib gcc-10-multilib g++-multilib g++-10-multilib \
            libc6-dev lib32ncurses-dev x11proto-core-dev libx11-dev tree lib32z-dev libgl1-mesa-dev libxml2-utils \
            xsltproc bc ccache lib32readline-dev lib32z1-dev liblz4-tool libncurses-dev libsdl1.2-dev \
            build-essential libgtk-3-dev libglu1-mesa-dev freeglut3-dev git libxml2 lzop pngcrush schedtool squashfs-tools \
            imagemagick libbz2-dev lzma ncftp qemu-user-static libstdc++-10-dev libncurses6 python3 tar

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 'latest'

    - name: Install OpenJDK
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '11'

    - name: Install repo
      run: |
        mkdir ~/bin
        curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
        chmod a+x ~/bin/repo
        sudo ln -sf ~/bin/repo /usr/bin/repo

    - name: Configure Git identity and URL rewriting (SSH -> HTTPS)
      run: |
        git config --global user.name "Saad"
        git config --global user.email "saadelasfur@gmail.com"
        git config --global url."https://github.com/".insteadOf "git@github.com:"
        git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"

    - name: Initialize repo
      run: |
        mkdir workspace
        cd workspace
        echo "workspace-folder=$(pwd)" >> $GITHUB_OUTPUT
        repo init --depth=1 -u ${{ github.event.inputs.MANIFEST_URL }} -b ${{ github.event.inputs.MANIFEST_BRANCH }}
      id: pwd

    - name: Repo Sync
      run: |
        repo sync -j$(nproc --all) --force-sync
      working-directory: workspace

    - name: Clone device tree
      run: |
        git clone ${{ github.event.inputs.DEVICE_TREE_URL }} -b ${{ github.event.inputs.DEVICE_TREE_BRANCH }} ./${{ github.event.inputs.DEVICE_PATH }}
      working-directory: ${{ steps.pwd.outputs.workspace-folder }}

    - name: Set Swap Space
      uses: pierotofy/set-swap-space@master
      with:
        swap-size-gb: 24

    - name: Building recovery
      run: |
        export ALLOW_MISSING_DEPENDENCIES=true
        source build/envsetup.sh
        if [ -d build/release/release_configs ]; then
          echo "Available releases:"
          ls build/release/release_configs
        fi
        lunch ${{ github.event.inputs.MAKEFILE_NAME }}-${{ github.event.inputs.BUILD_RELEASE }}-eng
        make clean
        TARGET="${{ github.event.inputs.BUILD_TARGET }}"
        mka "${TARGET//_/}image" -j$(nproc --all)
      working-directory: ${{ steps.pwd.outputs.workspace-folder }}

    - name: Set Date Variables
      run: |
        echo "DATE_SHORT=$(date +%Y%m%d)" >> $GITHUB_OUTPUT
        echo "DATE_TAG=$(date +%Y%m%d%H%M%S)" >> $GITHUB_OUTPUT
        echo "DATE_LONG=$(date +%Y%m%d-%H%M)" >> $GITHUB_OUTPUT
      id: date

    - name: Archive the files
      run: |
        ls -a ${{ steps.pwd.outputs.workspace-folder }}/out/target/product/ && echo
        ls -a ${{ steps.pwd.outputs.workspace-folder }}/out/target/product/${{ github.event.inputs.DEVICE_NAME }}/ && echo
        cd out/target/product/${{ github.event.inputs.DEVICE_NAME }}
        NAME="PBRP-${{ github.event.inputs.DEVICE_NAME }}-${{ github.event.inputs.PBRP_VERSION }}-${{ steps.date.outputs.DATE_LONG }}"
        tar -cvf "$NAME.tar" ${{ github.event.inputs.BUILD_TARGET }}.img
        mv ${{ github.event.inputs.BUILD_TARGET }}.img "$NAME.img"
        ZIP=$(ls PBRP*.zip 2>/dev/null | head -n 1 || true)
        if [ -n "$ZIP" ]; then
          mv "$ZIP" "$NAME.zip"
        fi
      working-directory: ${{ steps.pwd.outputs.workspace-folder }}

    - name: Upload to Release
      uses: softprops/action-gh-release@v2
      with:
        files: |
          workspace/out/target/product/${{ github.event.inputs.DEVICE_NAME }}/PBRP-${{ github.event.inputs.DEVICE_NAME }}-${{ github.event.inputs.PBRP_VERSION }}-${{ steps.date.outputs.DATE_LONG }}.*
        name: pbrp-${{ github.event.inputs.DEVICE_NAME }}-${{ steps.date.outputs.DATE_SHORT }}
        tag_name: ${{ steps.date.outputs.DATE_TAG }}
        body: |
          Manifest: ${{ github.event.inputs.MANIFEST_BRANCH }}
          Device: ${{ github.event.inputs.DEVICE_NAME }}
          Release: ${{ github.event.inputs.BUILD_RELEASE }}
          Target: ${{ github.event.inputs.BUILD_TARGET }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        
