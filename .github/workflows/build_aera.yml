name: Build AERA

on:
  workflow_dispatch:
    inputs:
      MANIFEST_URL:
        description: Manifest URL
        required: true
        default: 'https://github.com/AERA-Recovery/android_manifest.git'
      MANIFEST_BRANCH:
        description: Manifest Branch
        required: true
        default: 'aera-16.0'
      DEVICE_TREE_URL:
        description: Device Tree URL
        required: true
        default: 'https://github.com/AERA-Recovery/android_device_xiaomi_peridot-AERA.git'
      DEVICE_TREE_BRANCH:
        description: Device Tree Branch
        required: true
        default: 'aera-16.0'
      DEVICE_PATH:
        description: Device Path
        required: true
        default: 'device/xiaomi/peridot'
      DEVICE_NAME:
        description: Device Name
        required: true
        default: 'peridot'
      MAKEFILE_NAME:
        description: Makefile Name
        required: true
        default: 'twrp_peridot'
      BUILD_RELEASE:
        description: Build Release (trunk_staging, ap3a, bp1a, bp2a...)
        required: true
        default: 'bp2a'
      BUILD_TARGET:
        description: Build Target (recovery, boot, vendor_boot)
        required: true
        default: 'recovery'

env:
  CCACHE_DIR: /home/runner/.ccache

jobs:
  build:
    if: github.event.repository.owner.id == github.event.sender.id
    runs-on: ubuntu-24.04
    timeout-minutes: 355
    permissions:
      contents: write
    steps:
    - name: Check Out
      uses: actions/checkout@v4
      with:
        fetch-depth: 1

    - name: Cleanup
      uses: rokibhasansagar/slimhub_actions@main

    - name: Prepare the environment
      run: |
        sudo apt-get update
        DEBIAN_FRONTEND=noninteractive sudo apt-get install -yq --no-install-recommends \
            gperf gcc-multilib g++-multilib libc6-dev-i386 lib32ncurses-dev lib32z1-dev \
            x11proto-core-dev libx11-dev libgl1-mesa-dev libxml2-utils xsltproc bc ccache \
            liblz4-tool libncurses-dev build-essential git lzop pngcrush schedtool \
            squashfs-tools python3 zip unzip flex bison curl
        mkdir -p ~/bin
        curl -sS https://storage.googleapis.com/git-repo-downloads/repo -o ~/bin/repo
        chmod a+x ~/bin/repo
        sudo ln -sf ~/bin/repo /usr/bin/repo
        git config --global user.name "Saad"
        git config --global user.email "saadelasfur@gmail.com"
        git config --global url."https://github.com/".insteadOf "git@github.com:"
        git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"

    - name: Set Swap Space
      uses: pierotofy/set-swap-space@master
      with:
        swap-size-gb: 24

    - name: Restore ccache
      uses: actions/cache/restore@v4
      with:
        path: /home/runner/.ccache
        key: ccache-${{ github.event.inputs.MANIFEST_BRANCH }}-${{ github.run_id }}
        restore-keys: |
          ccache-${{ github.event.inputs.MANIFEST_BRANCH }}-

    - name: Initialize and sync repo
      id: pwd
      run: |
        mkdir workspace
        cd workspace
        echo "workspace-folder=$(pwd)" >> $GITHUB_OUTPUT
        repo init --depth=1 --no-tags -u ${{ github.event.inputs.MANIFEST_URL }} -b ${{ github.event.inputs.MANIFEST_BRANCH }}
        repo sync -c --no-tags --no-clone-bundle --optimized-fetch --prune -j8 --force-sync
        git clone --depth=1 ${{ github.event.inputs.DEVICE_TREE_URL }} -b ${{ github.event.inputs.DEVICE_TREE_BRANCH }} ./${{ github.event.inputs.DEVICE_PATH }}

    - name: Building recovery
      timeout-minutes: 320
      run: |
        export ALLOW_MISSING_DEPENDENCIES=true
        export USE_CCACHE=1
        export CCACHE_EXEC=/usr/bin/ccache
        export CCACHE_BASEDIR="$PWD"
        export CCACHE_NOHASHDIR=true
        ccache -M 8G
        ccache -o compression=true
        ccache -o compression_level=1
        source build/envsetup.sh
        if [ -d build/release/release_configs ]; then
          ls build/release/release_configs
        fi
        lunch ${{ github.event.inputs.MAKEFILE_NAME }}-${{ github.event.inputs.BUILD_RELEASE }}-eng
        TARGET="${{ github.event.inputs.BUILD_TARGET }}"
        mka "${TARGET//_/}image" -j$(nproc --all)
        ccache -s
      working-directory: ${{ steps.pwd.outputs.workspace-folder }}

    - name: Save ccache
      if: always()
      uses: actions/cache/save@v4
      with:
        path: /home/runner/.ccache
        key: ccache-${{ github.event.inputs.MANIFEST_BRANCH }}-${{ github.run_id }}

    - name: Archive the files
      id: pkg
      run: |
        cd out/target/product/${{ github.event.inputs.DEVICE_NAME }}
        ls -a
        NAME="AERA-${{ github.event.inputs.DEVICE_NAME }}-$(date +%Y%m%d-%H%M)"
        echo "NAME=$NAME" >> $GITHUB_OUTPUT
        echo "DATE_SHORT=$(date +%Y%m%d)" >> $GITHUB_OUTPUT
        echo "DATE_TAG=$(date +%Y%m%d%H%M%S)" >> $GITHUB_OUTPUT
        tar -cvf "$NAME.tar" ${{ github.event.inputs.BUILD_TARGET }}.img
        mv ${{ github.event.inputs.BUILD_TARGET }}.img "$NAME.img"
        ZIP=$(ls AERA*.zip 2>/dev/null | head -n 1 || true)
        if [ -n "$ZIP" ]; then
          mv "$ZIP" "$NAME.zip"
        fi
      working-directory: ${{ steps.pwd.outputs.workspace-folder }}

    - name: Upload to Release
      uses: softprops/action-gh-release@v2
      with:
        files: |
          workspace/out/target/product/${{ github.event.inputs.DEVICE_NAME }}/${{ steps.pkg.outputs.NAME }}.*
        name: aera-${{ github.event.inputs.DEVICE_NAME }}-${{ steps.pkg.outputs.DATE_SHORT }}
        tag_name: ${{ steps.pkg.outputs.DATE_TAG }}
        body: |
          Manifest: ${{ github.event.inputs.MANIFEST_BRANCH }}
          Device: ${{ github.event.inputs.DEVICE_NAME }}
          Release: ${{ github.event.inputs.BUILD_RELEASE }}
          Target: ${{ github.event.inputs.BUILD_TARGET }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
